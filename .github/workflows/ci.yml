name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-policy:
    name: Central action policy preflight
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Check out central action policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/.github
          ref: main
          path: .central-action-policy
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - name: Install policy dependencies
        run: python -m pip install PyYAML==6.0.2
      - name: Require centrally approved immutable action commits
        run: >-
          python .central-action-policy/scripts/qualification_policy.py validate
          --policy .central-action-policy/qualification/policy.json
          --target ai
          --workflow-directory .github/workflows

  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
            framework: '^12.61.1'
            testbench: '^10.0'
            phpunit: '^11.0'
          - php: '8.3'
            laravel: '12'
            framework: '^12.61.1'
            testbench: '^10.0'
            phpunit: '^11.0'
          - php: '8.4'
            laravel: '13'
            framework: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Select compatibility dependencies
        run: |
          composer require --no-update "laravel/framework:${{ matrix.framework }}"
          composer require --dev --no-update \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Validate package metadata
        run: composer validate --strict --no-check-all

      - name: Check formatting
        run: composer format

      - name: Run static analysis
        run: composer stan

      - name: Run tests
        run: composer test

  composer-resolver-smoke:
    name: Composer prerelease resolver smoke
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Resolve from a stable-default Composer root
        run: tests/composer-resolver-smoke.sh

  target-branch-qualification:
    name: Target branch qualification
    if: ${{ always() }}
    needs: [action-policy, test, composer-resolver-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Require central action policy preflight
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          ACTION_POLICY_RESULT: ${{ needs.action-policy.result }}
        run: test "$ACTION_POLICY_RESULT" = success

      - name: Require complete GitHub qualification
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          RESOLVER_SMOKE_RESULT: ${{ needs.composer-resolver-smoke.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$RESOLVER_SMOKE_RESULT" = success

      - name: Check out candidate source
        if: ${{ github.server_url != 'https://github.com' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Validate bounded candidate workload
        if: ${{ github.server_url != 'https://github.com' }}
        run: |
          composer validate --strict --no-check-all
          find src config tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
